<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>GBP → UZS Live Rates</title>
    <style>
        body { font-family: monospace; background: #fafafa; }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            padding: 6px 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        .up { color: green; font-weight: bold; }
        .down { color: red; font-weight: bold; }
        .footer {
            margin-top: 15px;
            font-size: 0.9em;
            color: #555;
        }
        .links a { margin-right: 8px; }
    </style>
</head>
<body>

<h2>💱 GBP → UZS Live Rates</h2>

<table>
    <thead>
    <tr>
        <th>Provider</th>
        <th>Rate (UZS)</th>
        <th>Δ Change</th>
        <th>Fee (£)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${rates}"
        th:with="prev=${prevRates[r.provider()]},
                     delta=${r.rate().subtract(prev != null ? prev : r.rate())}">
        <td th:text="${r.provider()}"></td>
        <td th:text="${#numbers.formatDecimal(r.rate(), 0, 'COMMA', 2, 'POINT')}"></td>
        <td th:text="${delta > 0 ? '(🟢 +' + #numbers.formatDecimal(delta,0,'COMMA',2,'POINT') + ' UZS)'
                          : (delta < 0 ? '(🔴 -' + #numbers.formatDecimal(delta.abs(),0,'COMMA',2,'POINT') + ' UZS)'
                          : '')}"
            th:classappend="${delta > 0} ? 'up' : ${delta < 0} ? 'down' : ''"></td>
        <td th:text="${r.provider() == 'Moneff' or r.provider() == 'TransferGo' ? '0.00' : '1.00'}"></td>
    </tr>
    </tbody>
</table>

<div class="footer">
    Updated: <span th:text="${#temporals.format(updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
</div>

<div class="links">
    Links:
    <a href="https://transfergo.com">TransferGo</a> |
    <a href="https://qrco.de/bfsv7o">Moneff</a> |
    <a href="https://profee.com">Profee</a> |
    <a href="https://paysend.com">Paysend</a>
</div>

</body>
</html>
